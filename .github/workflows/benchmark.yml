name: Performance Benchmark

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Upper-limit benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRUCTURE_BENCHMARK_RESULT_PATH: benchmark-results/structure-operations.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scheduled performance benchmarks
        run: npm run benchmark:ci
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark-${{ github.run_id }}
          path: |
            benchmark-results/
            test-results/
          if-no-files-found: warn
          retention-days: 30
