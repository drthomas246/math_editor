name: Verify

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Generate comment inspection evidence
        run: npm run comment:evidence
      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run verify:checks
      - name: Build
        run: npm run build
      # Viteがdistを空にした後でPluginを再生成し、検証済みの配布物を残す。
      - name: Build and verify portable Plugin
        run: npm run plugin:build && npm run plugin:verify
      - name: Set up Python for Plugin runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Plugin test dependencies
        run: |
          python -m pip install -r AI/plugin/requirements-test.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Verify Plugin runtime and PDF fallback
        run: |
          node dist/math-editor-ai/skills/math-editor-textbook-import/scripts/check_runtime_capabilities.mjs --python python --figures-required
          python scripts/test-plugin-crop.py
      - name: Upload tested portable Plugin
        uses: actions/upload-artifact@v4
        with:
          name: math-editor-ai-phase1
          path: dist/math-editor-ai/
          include-hidden-files: false
          if-no-files-found: error
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser lifecycle E2E
        run: npm run test:e2e
      - name: Recheck inspected worktree before upload
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run comment:evidence:verify
      - name: Bind inspection evidence to the checkout commit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run comment:evidence:verify -- --commit "$EXPECTED_COMMIT"
      - name: Upload comment inspection evidence
        id: evidence_upload
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: comment-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/comment-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact identity
        if: ${{ always() && steps.evidence_upload.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.evidence_upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          printf 'Comment inspection evidence: %s\n\nArtifact SHA-256: `%s`\n' "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
